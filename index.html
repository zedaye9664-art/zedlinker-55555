  <style>
    /* INSTANT LOADER - Shows in 0.1s before React loads */
    #instant-loader{position:fixed;inset:0;background:#FFFBFD;z-index:99999;display:flex;flex-direction:column;font-family:Outfit,Inter,sans-serif}
    #instant-loader .i-header{height:64px;background:white;border-bottom:1px solid #ffe0eb;display:flex;align-items:center;padding:0 16px;gap:12px}
    #instant-loader .i-logo{width:44px;height:44px;background:#FF4B8B;border-radius:16px;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:22px}
    #instant-loader .i-skel{animation:pulse 1.2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    #instant-loader .i-hero{margin:24px 16px 0;background:linear-gradient(135deg,#FF4B8B,#8BC34A);border-radius:28px;padding:24px;color:white}
    #instant-loader .i-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:16px}
    #instant-loader .i-card{background:white;border:1px solid #f0f0f0;border-radius:20px;padding:16px;height:140px}
    #instant-loader .i-bar{height:12px;background:#f0f0f0;border-radius:8px;margin:8px 0}
    #instant-loader .i-bar.w60{width:60%}.i-bar.w80{width:80%}.i-bar.w40{width:40%}
  </style>

(function(){
  try{
    const path=decodeURIComponent(location.pathname.replace(/\/+$/,''))||'/';
    const m=path.match(/^\/(product|blog|link|ad)\/([^/]+)$/i);

    if(!canonical.parentNode) document.head.appendChild(canonical);

    meta.name='description'; meta.content='Explore '+label.toLowerCase()+' details on ZED LINKER: '+pretty+'.';

    document.documentElement.setAttribute('data-zed-route',type);
    document.documentElement.setAttribute('data-zed-slug',slug);
