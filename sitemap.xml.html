<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sitemap Generation</title>
</head>
<body>
<pre id="xml-content">Loading live sitemap data from Firestore...</pre>
<script>
async function generateSitemap() {
    try {
        const proj = "zedlinker-55555";
        const fetchCol = async (col) => {
            const r = await fetch(`https://googleapis.com{proj}/databases/(default)/documents/${col}`);
            if(!r.ok) return '';
            const d = await r.json();
            let xml = '';
            if(d.documents) {
                d.documents.forEach(doc => {
                    const name = doc.name.split('/').pop();
                    if(col === 'blogs') {
                        const slug = doc.fields && doc.fields.slug && doc.fields.slug.stringValue ? doc.fields.slug.stringValue : name;
                        xml += `\n  <url>\n    <loc>https://zedlinker.store{slug}</loc>\n    <changefreq>weekly</changefreq>\n    <priority>0.8</priority>\n  </url>`;
                    } else if(col === 'links') {
                        xml += `\n  <url>\n    <loc>https://zedlinker.store{name}</loc>\n    <changefreq>daily</changefreq>\n    <priority>0.7</priority>\n  </url>`;
                    } else if(col === 'products') {
                        xml += `\n  <url>\n    <loc>https://zedlinker.store{name}</loc>\n    <changefreq>daily</changefreq>\n    <priority>0.7</priority>\n  </url>`;
                    }
                });
            }
            return xml;
        };
        const staticUrls = '\n  <url>\n    <loc>https://zedlinker.store</loc>\n    <changefreq>daily</changefreq>\n    <priority>1.0</priority>\n  </url>\n  <url>\n    <loc>https://zedlinker.storeindexing.html</loc>\n    <changefreq>weekly</changefreq>\n    <priority>0.5</priority>\n  </url>\n  <url>\n    <loc>https://zedlinker.storeproduct.html</loc>\n    <changefreq>weekly</changefreq>\n    <priority>0.5</priority>\n  </url>';
        const bXml = await fetchCol('blogs');
        const lXml = await fetchCol('links');
        const pXml = await fetchCol('products');
        const finalSitemap = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://sitemaps.org">${staticUrls}${bXml}${lXml}${pXml}\n</urlset>`;
        
        document.getElementById('xml-content').textContent = finalSitemap;
    } catch (e) {
        document.getElementById('xml-content').textContent = "Error fetching data";
    }
}
generateSitemap();
</script>
</body>
</html>
